<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>win10ml — Windows 10 HUD for the web (live demo)</title>
		<meta name="description" content="win10ml: framework-agnostic Windows 10 desktop HUD for the web. Zero dependencies. Try it live — drag the windows." />
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="./win10-shell.css" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				font-family: "Segoe UI", system-ui, sans-serif;
			}
			body {
				background:
					radial-gradient(120% 90% at 50% 115%, rgba(64, 170, 230, 0.85) 0%, rgba(20, 90, 160, 0.55) 38%, rgba(0, 0, 0, 0) 70%),
					linear-gradient(180deg, #06121f 0%, #0a2c4f 55%, #0e4a86 100%);
			}
			.pages-hero {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				padding: 20px 24px;
				pointer-events: none;
				user-select: none;
				-webkit-user-select: none;
			}
			.pages-title {
				color: #fff;
				text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
			}
			.pages-title h1 {
				margin: 0;
				font-size: 28px;
				font-weight: 600;
				letter-spacing: 0.5px;
			}
			.pages-title h1 span {
				font-weight: 300;
				opacity: 0.85;
			}
			.pages-title p {
				margin: 6px 0 0;
				font-size: 13px;
				opacity: 0.85;
			}
			.pages-links {
				display: flex;
				gap: 8px;
				pointer-events: auto;
			}
			.pages-links a {
				color: #fff;
				font-size: 12px;
				text-decoration: none;
				padding: 6px 14px;
				border: 1px solid rgba(255, 255, 255, 0.5);
				background: rgba(0, 0, 0, 0.25);
			}
			.pages-links a:hover {
				background: rgba(255, 255, 255, 0.15);
				border-color: #fff;
			}
			.pages-hint {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: #fff;
				opacity: 0.55;
				font-size: 14px;
				pointer-events: none;
				user-select: none;
				-webkit-user-select: none;
				text-align: center;
				text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
			}
		</style>
	</head>
	<body>
		<div class="pages-hero">
			<div class="pages-title">
				<h1>win10ml <span>— Windows 10 HUD for the web</span></h1>
				<p>Zero dependencies · vanilla JS · drag the windows around, right-click anywhere</p>
			</div>
			<div class="pages-links">
				<a href="https://github.com/Kisakay/winml" target="_blank" rel="noopener">GitHub</a>
				<a href="https://www.npmjs.com/package/win10ml" target="_blank" rel="noopener">npm</a>
			</div>
		</div>
		<div class="pages-hint">Right-click anywhere · double-click a titlebar to maximize</div>
		<script src="./demo.js"></script>
	</body>
</html>
